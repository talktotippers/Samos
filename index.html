<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samos Honeymoon Planner</title>
  <meta name="description" content="A mobile first Samos holiday planner for beaches, food, beer, wine, day trips and Greek phrases.">
  <meta name="theme-color" content="#0b6b75">
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-view="home" aria-label="Home">
      <span class="brand-mark">Σ</span>
      <span><strong>Samos</strong><small>20 to 27 September</small></span>
    </button>
    <button id="locationButton" class="pill-btn">Use my location</button>
  </header>

  <main id="app" class="app-shell"></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-view="home" class="active"><span>Today</span></button>
    <button data-view="places"><span>Places</span></button>
    <button data-view="guide"><span>Guide</span></button>
    <button data-view="phrases"><span>Greek</span></button>
    <button data-view="saved"><span>Saved</span></button>
  </nav>

  <script src="./js/data.js" defer></script>
  <script src="./js/app.js" defer></script>
</body>
</html>
