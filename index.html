<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Samos Trip</title>
  <meta name="description" content="A personal Samos holiday companion for beaches, food, beer, wine, day plans, local guide and memories." />
  <meta name="theme-color" content="#176b73" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" data-view="today" aria-label="Go to today">
      <span class="brand-mark">Σ</span>
      <span>
        <strong>Our Samos Trip</strong>
        <small>20 to 27 September</small>
      </span>
    </button>
    <button id="roccoToggle" class="pill" type="button">Rocco mode</button>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-view="today" class="active"><span>🏠</span>Today</button>
    <button data-view="eat"><span>🍽</span>Eat</button>
    <button data-view="near"><span>📍</span>Near</button>
    <button data-view="explore"><span>🗺</span>Explore</button>
    <button data-view="done"><span>✅</span>Done</button>
    <button data-view="memory"><span>📖</span>Memory</button>
  </nav>

  <script src="./js/data.js" defer></script>
  <script src="./js/app.js" defer></script>
</body>
</html>
